<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSQU'OÙ ?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@700;900&display=swap');

    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0603; color: white; }
    .title-font { font-family: 'Playfair Display', serif; }
    .fantasy-font { font-family: 'Cinzel', serif; }

    .wheel {
      width: 340px;
      height: 340px;
      border: 16px solid #d4af37;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.8);
      transition: transform 4.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .wheel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: conic-gradient(#b45309 0deg 45deg, #854d0e 45deg 90deg, #b45309 90deg 135deg, #854d0e 135deg 180deg, #b45309 180deg 225deg, #854d0e 225deg 270deg, #b45309 270deg 315deg, #854d0e 315deg 360deg);
    }

    .card {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3 / 4.1;
      border: 10px solid #d4af37;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 1.2s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #1a120b;
    }

    .mamie-text {
      text-shadow: 0 0 25px #fcd34d, 0 0 45px #f59e0b, 4px 4px 0 #451a03;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">

  <!-- Screen 1 -->
  <div id="screen1" class="min-h-screen w-full flex flex-col items-center justify-center px-6 text-center">
    <h1 class="title-font text-6xl font-black text-amber-200">JUSQU'OÙ ?</h1>
    <p class="text-amber-400">LE JEU</p>

    <div class="mt-12 bg-[#1c140d] border border-amber-900 rounded-2xl p-8 max-w-sm w-full">
      <div class="text-6xl mb-6">🎁</div>
      <h2 class="text-3xl font-bold">Contenu bonus débloqué</h2>
      <p class="text-amber-100/80 mt-2">Vous avez découvert une carte spéciale.</p>
    </div>

    <button onclick="startExperience()" class="mt-16 bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold text-2xl px-16 py-6 rounded-2xl transition-all">
      DÉCOUVRIR
    </button>
  </div>

  <!-- Wheel -->
  <div id="wheelScreen" class="hidden min-h-screen w-full flex flex-col items-center justify-center px-6">
    <div class="relative">
      <div id="wheel" class="wheel mx-auto"></div>
      <div class="absolute top-[-30px] left-1/2 -translate-x-1/2 text-7xl">▼</div>
    </div>
    <p class="mt-10 text-amber-300 text-xl">La chance tourne...</p>
  </div>

  <!-- Card -->
  <div id="cardScreen" class="hidden min-h-screen w-full flex items-center justify-center px-6">
    <div id="mysteryCard" class="card" onclick="flipCard()">
      <div class="card-inner">
        <!-- Front -->
        <div class="card-front bg-[#1c140d]">
          <div class="text-8xl mb-8">?</div>
          <h2 class="title-font text-4xl font-bold text-amber-300">CARTE MYSTÈRE</h2>
          <p class="text-amber-400 mt-10">Touchez pour révéler</p>
        </div>
        <!-- Back -->
        <div class="card-back">
          <div class="text-7xl mb-6">❤️</div>
          <p class="text-amber-300 text-2xl tracking-widest">FÉLICITATIONS</p>
          <h1 class="title-font text-6xl font-black text-amber-100 mt-6">TU VAS DEVENIR</h1>
          <h1 class="mamie-text fantasy-font text-[82px] leading-none font-black text-amber-300">MAMIE</h1>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="hidden fixed inset-0 z-50 pointer-events-none"></canvas>

  <script>
    function startExperience() {
      document.getElementById('screen1').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('screen1').classList.add('hidden');
        document.getElementById('wheelScreen').classList.remove('hidden');

        document.getElementById('wheel').style.transform = 'rotate(3340deg)';

        setTimeout(() => {
          document.getElementById('wheelScreen').classList.add('hidden');
          document.getElementById('cardScreen').classList.remove('hidden');
        }, 4300);
      }, 700);
    }

    function flipCard() {
      document.getElementById('mysteryCard').classList.add('flipped');
      setTimeout(launchConfetti, 800);
    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#d4af37', '#fcd34d', '#b45309'];
      const pieces = [];
      for (let i = 0; i < 200; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -400,
          size: Math.random() * 13 + 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 8 + 5,
          angle: Math.random() * 1.2 - 0.6,
          rot: Math.random() * 360
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        pieces.forEach(p => {
          p.y += p.speed;
          p.rot += 12;
          p.x += p.angle;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();
          if (p.y < canvas.height + 100) alive = true;
        });
        if (alive) requestAnimationFrame(animate);
        else canvas.classList.add('hidden');
      }
      animate();
    }
  </script>
</body>
</html>
