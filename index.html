<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSQU'OÙ ?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --gold: #facc15;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .title-font {
      font-family: 'Playfair Display', serif;
    }

    .wheel {
      transition: transform 3.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .card {
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      backface-visibility: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(800px) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center overflow-hidden">
  <div id="screen1" class="min-h-screen w-full flex flex-col items-center justify-center text-center px-6 transition-opacity duration-700">
    <div class="mb-12">
      <h1 class="title-font text-7xl md:text-8xl font-bold tracking-tighter text-white mb-2">JUSQU'OÙ ?</h1>
      <p class="text-amber-400 text-xl font-light tracking-widest">LE JEU</p>
    </div>

    <div class="bg-zinc-900/80 backdrop-blur-xl rounded-3xl p-10 max-w-md w-full border border-zinc-800">
      <div class="text-6xl mb-6">🎁</div>
      <h2 class="text-3xl font-semibold mb-3">Contenu bonus débloqué</h2>
      <p class="text-zinc-400 text-lg">Vous avez découvert une carte spéciale.</p>
    </div>

    <button onclick="startExperience()" 
            class="mt-16 bg-white text-zinc-900 font-semibold text-xl px-12 py-6 rounded-2xl hover:scale-105 active:scale-95 transition-all duration-200 shadow-2xl shadow-amber-500/30">
      Découvrir
    </button>
  </div>

  <!-- Wheel Screen -->
  <div id="wheelScreen" class="hidden min-h-screen w-full flex flex-col items-center justify-center px-6">
    <div class="relative">
      <div id="wheel" class="wheel w-80 h-80 rounded-full border-8 border-amber-400 overflow-hidden relative shadow-2xl">
        <div class="absolute inset-0 bg-gradient-to-br from-amber-300 via-yellow-400 to-amber-500"></div>
        <!-- Segments -->
        <div class="absolute inset-0" style="background: conic-gradient(#eab308 0deg 45deg, #f59e0b 45deg 90deg, #eab308 90deg 135deg, #f59e0b 135deg 180deg, #eab308 180deg 225deg, #f59e0b 225deg 270deg, #eab308 270deg 315deg, #f59e0b 315deg 360deg);"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-20 h-20 bg-zinc-900 rounded-full border-4 border-white flex items-center justify-center text-4xl">?</div>
        </div>
      </div>
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 text-5xl z-10">⭐</div>
    </div>

    <p class="mt-12 text-zinc-400 text-lg">Révélation en cours...</p>
  </div>

  <!-- Card Screen -->
  <div id="cardScreen" class="hidden min-h-screen w-full flex items-center justify-center px-6">
    <div id="mysteryCard" class="card w-full max-w-xs" onclick="flipCard()">
      <div class="card-inner relative w-full aspect-[3/4] rounded-3xl shadow-2xl">
        <!-- Front -->
        <div class="card-front absolute inset-0 bg-zinc-900 rounded-3xl border border-amber-400 flex flex-col items-center justify-center p-8">
          <div class="text-8xl mb-6">?</div>
          <h2 class="text-4xl font-bold text-center title-font">Carte Mystère</h2>
          <p class="text-amber-400 mt-8 text-center">Touchez pour révéler</p>
        </div>
        
        <!-- Back -->
        <div class="card-back absolute inset-0 bg-gradient-to-br from-rose-900 to-purple-900 rounded-3xl flex flex-col items-center justify-center p-8 text-center">
          <div class="text-6xl mb-6">❤️</div>
          <p class="text-amber-300 text-xl tracking-widest">FÉLICITATIONS</p>
          <h1 class="title-font text-7xl font-bold mt-4 leading-none text-white drop-shadow-lg">TU VAS DEVENIR</h1>
          <h1 class="title-font text-[92px] font-bold leading-none text-amber-300 tracking-tighter drop-shadow-2xl mt-2">MAMIE</h1>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="hidden fixed inset-0 pointer-events-none z-50"></canvas>

  <script>
    function startExperience() {
      document.getElementById('screen1').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('screen1').classList.add('hidden');
        document.getElementById('wheelScreen').classList.remove('hidden');
        spinWheel();
      }, 700);
    }

    function spinWheel() {
      const wheel = document.getElementById('wheel');
      // 3.2 secondes de rotation + léger overshoot
      wheel.style.transform = 'rotate(3240deg)'; // 9 tours complets

      setTimeout(() => {
        document.getElementById('wheelScreen').classList.add('hidden');
        document.getElementById('cardScreen').classList.remove('hidden');
      }, 3400);
    }

    function flipCard() {
      const card = document.getElementById('mysteryCard');
      card.classList.add('flipped');

      // Lancer les confettis après la fin de la rotation
      setTimeout(() => {
        launchConfetti();
      }, 600);
    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#facc15', '#eab308', '#ec4899', '#c026d3', '#f43f5e'];
      const confettiPieces = [];

      for (let i = 0; i < 180; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - 500,
          rotation: Math.random() * 360,
          size: Math.random() * 12 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 6 + 4,
          angle: Math.random() * 0.6 - 0.3
        });
      }

      let animationFrame;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let stillAlive = false;

        confettiPieces.forEach(p => {
          p.y += p.speed;
          p.rotation += 8;
          p.x += p.angle;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();

          if (p.y < canvas.height + 50) stillAlive = true;
        });

        if (stillAlive) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          canvas.classList.add('hidden');
        }
      }
      animate();

      // Arrêt progressif
      setTimeout(() => {
        cancelAnimationFrame(animationFrame);
      }, 4500);
    }

    // Responsive canvas
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });
  </script>
</body>
</html>
